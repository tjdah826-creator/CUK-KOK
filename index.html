<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>CUK콕</title>

  <!-- iOS 홈 화면 추가(PWA) 전용 메타 태그 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CUK콕">
  <meta name="theme-color" content="#00356B">

  <!-- iOS 전용 CUK콕 홈 화면 앱 아이콘 -->
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='115' fill='%2300356B'/><circle cx='256' cy='256' r='180' fill='none' stroke='%23EDF4FD' stroke-width='14'/><path d='M256 120 V392 M160 210 H352' stroke='%23FFFFFF' stroke-width='32' stroke-linecap='round'/><circle cx='256' cy='210' r='20' fill='%23E53E3E'/><text x='256' y='445' font-size='56' font-family='sans-serif' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'>CUK-KOK</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cuk-primary: #00356B;
      --cuk-accent: #0A5FC2;
      --cuk-soft: #EDF4FD;
      --cuk-gold: #B37D20;
      --bg: #F7F9FC;
      --surface: #FFFFFF;
      --ink: #191F28;
      --ink-secondary: #4E5968;
      --muted: #8B95A1;
      --line: #E5E8EB;
      --line-subtle: #F2F4F6;
      --hot: #E53E3E;
      --hot-soft: #FEF0F0;
      --warn: #D97706;
      --warn-soft: #FEF3C7;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.03), 0 2px 8px rgba(0,0,0,0.02);
      --shadow-hover: 0 8px 24px rgba(0, 37, 85, 0.10);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --font-body: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-display: "Hahmlet", serif;
      --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F141C;
        --surface: #18202C;
        --ink: #F2F4F8;
        --ink-secondary: #B0B8C6;
        --muted: #6B7684;
        --line: #263040;
        --line-subtle: #1E2634;
        --cuk-primary: #5296E8;
        --cuk-accent: #78B1F5;
        --cuk-soft: #172B45;
        --hot: #FF6B6B;
        --hot-soft: #381A1A;
        --warn: #FBBF24;
        --warn-soft: #382A12;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(60px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 8px 4px 14px;
      border-bottom: 2px solid var(--line);
    }
    .brand-wrap { display: flex; flex-direction: column; gap: 4px; }
    .univ-tag {
      font-size: 12px;
      font-weight: 700;
      color: var(--cuk-accent);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .univ-tag::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cuk-accent);
    }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .header-sub {
      color: var(--ink-secondary);
      font-size: 13.5px;
    }

    .profile-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .profile-header {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .profile-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .profile-badge-summary {
      font-size: 12px;
      color: var(--ink-secondary);
      font-weight: 500;
    }
    .btn-toggle {
      background: var(--line-subtle);
      border: none;
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-secondary);
      cursor: pointer;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      padding: 16px 18px;
      background: var(--bg);
      border-top: 1px solid var(--line-subtle);
    }
    .filter-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-secondary);
    }
    select {
      font: inherit;
      font-size: 13px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      outline: none;
    }

    .chips-area {
      padding: 12px 18px;
      border-top: 1px solid var(--line-subtle);
      background: var(--surface);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .chips-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-right: 4px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--ink-secondary);
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 4px 12px;
      border-radius: 99px;
      cursor: pointer;
    }
    .chip:has(input:checked) {
      background: var(--cuk-soft);
      border-color: var(--cuk-accent);
      color: var(--cuk-accent);
      font-weight: 600;
    }
    .chip input { accent-color: var(--cuk-accent); }

    .tabs-wrapper {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 4px;
      box-shadow: var(--shadow-sm);
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font: inherit;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .tab-btn[aria-selected="true"] {
      background: var(--cuk-primary);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0, 53, 107, 0.25);
    }
    .tab-badge {
      font-family: var(--font-mono);
      font-size: 11.5px;
      padding: 1px 6px;
      border-radius: 99px;
      background: rgba(0,0,0,0.06);
    }
    .tab-btn[aria-selected="true"] .tab-badge {
      background: rgba(255,255,255,0.25);
      color: #FFFFFF;
    }

    .summary-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }
    .stat-pill {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      box-shadow: var(--shadow-sm);
    }
    .stat-label { font-size: 11.5px; color: var(--muted); font-weight: 600; }
    .stat-value { font-size: 17px; font-weight: 700; color: var(--ink); }
    .stat-value b { color: var(--cuk-accent); }
    .stat-value.highlight b { color: var(--hot); }

    .card-list { display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 16px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }
    @media (max-width: 600px) {
      .card { grid-template-columns: 1fr; gap: 10px; }
    }

    .dday-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--cuk-soft);
      border: 1px solid rgba(10, 95, 194, 0.15);
      border-radius: var(--radius-md);
      padding: 8px 6px;
      height: fit-content;
      text-align: center;
    }
    .dday-num {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      color: var(--cuk-accent);
    }
    .dday-sub { font-size: 10.5px; font-weight: 600; color: var(--muted); }
    .dday-box.hot { background: var(--hot-soft); border-color: rgba(229, 62, 62, 0.2); }
    .dday-box.hot .dday-num { color: var(--hot); }
    .dday-box.gap { background: var(--warn-soft); border-color: rgba(217, 119, 6, 0.2); }
    .dday-box.gap .dday-num { color: var(--warn); }

    .card-content { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink-secondary);
      border: 1px solid var(--line);
    }
    .tag.sch { background: var(--hot-soft); color: var(--hot); border-color: transparent; }
    .tag.primary { background: var(--cuk-soft); color: var(--cuk-accent); border-color: transparent; }
    .tag.date { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); border: none; background: transparent; }

    .btn-ics {
      margin-left: auto;
      font-family: var(--font-body);
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }

    .card-title {
      font-size: 15.5px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--ink);
    }
    .card-title a { color: inherit; text-decoration: none; }
    .card-title a:hover { color: var(--cuk-accent); }

    .benefit-line {
      font-size: 13px;
      color: var(--ink-secondary);
    }
    .benefit-line b { color: var(--cuk-primary); font-weight: 700; }

    .prep-box {
      font-size: 12.5px;
      color: var(--ink-secondary);
      background: var(--line-subtle);
      padding: 5px 10px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
    }
    .prep-box b { color: var(--ink); }

    details {
      background: var(--bg);
      border: 1px solid var(--line-subtle);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 4px;
    }
    summary {
      cursor: pointer;
      color: var(--cuk-accent);
      font-weight: 600;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "▾"; font-size: 13px; transition: transform 0.2s; }
    details[open] summary::after { transform: rotate(180deg); }

    .sum-content {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }
    .sum-block-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .sum-content ul { padding-left: 16px; display: flex; flex-direction: column; gap: 2px; }
    .sum-content ul.caution li { color: var(--hot); }
    .sum-content ul.caution li span { color: var(--ink); }
    .docs-list { list-style: none; padding-left: 0!important; display: flex; flex-direction: column; gap: 4px; }
    .docs-list li { display: flex; align-items: center; gap: 6px; }
    .quote-box {
      font-size: 11.5px;
      color: var(--ink-secondary);
      padding: 6px 10px;
      background: var(--surface);
      border-left: 3px solid var(--cuk-accent);
      border-radius: 0 4px 4px 0;
    }

    .gap-progress-wrap {
      margin-top: 6px;
      background: var(--line-subtle);
      border-radius: 99px;
      height: 7px;
      overflow: hidden;
    }
    .gap-bar-fill {
      background: linear-gradient(90deg, #F59E0B, #E53E3E);
      height: 100%;
      border-radius: 99px;
    }
    .guide-box {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      margin-top: 6px;
      font-size: 12.5px;
    }
    .empty-state {
      padding: 40px 16px;
      text-align: center;
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px dashed var(--line);
      color: var(--muted);
    }
    .hiddenlist {
      padding: 12px 16px;
      font-size: 12.5px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
    }
  </style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand-wrap">
      <div class="univ-tag">Catholic University of Korea · Smart Campus</div>
      <h1>CUK콕 (CUK-KOK)</h1>
      <div class="header-sub">가톨릭대 맞춤형 장학·공모전 기회 & 스펙 갭 알림 비서</div>
    </div>
  </header>

  <section class="profile-card">
    <div class="profile-header" id="btn-toggle-profile">
      <div class="profile-title">
        <span>👤 내 프로필</span>
        <span class="profile-badge-summary" id="profile-summary-text">3학년 · 경영·경제 · 재학</span>
      </div>
      <button class="btn-toggle" id="btn-toggle-label">조건 수정 ▾</button>
    </div>

    <div class="filter-grid" id="filter-panel" style="display:none;">
      <label class="filter-field">학년
        <select id="p-grade">
          <option value="1">1학년</option>
          <option value="2">2학년</option>
          <option value="3" selected>3학년</option>
          <option value="4">4학년</option>
        </select>
      </label>
      <label class="filter-field">전공 계열
        <select id="p-field">
          <option value="hum">인문·사회</option>
          <option value="biz" selected>경영·경제</option>
          <option value="sci">자연·공학</option>
          <option value="art">예체능</option>
        </select>
      </label>
      <label class="filter-field">학적 상태
        <select id="p-status">
          <option value="enrolled" selected>재학</option>
          <option value="leave">휴학</option>
        </select>
      </label>
      <label class="filter-field">직전학기 평점
        <select id="p-gpa">
          <option>2.5</option><option>2.8</option><option>3.0</option><option selected>3.3</option><option>3.5</option><option>4.0</option>
        </select>
      </label>
      <label class="filter-field">어학 (TOEIC)
        <select id="p-toeic">
          <option value="0">미보유</option><option>600</option><option selected>750</option><option>800</option><option>900</option>
        </select>
      </label>
      <label class="filter-field">공모전 팀 인원
        <select id="p-team">
          <option value="1">1명(개인)</option><option value="2">2명</option><option value="3">3명</option><option value="4">4명</option><option value="5" selected>5명 이상</option>
        </select>
      </label>
    </div>

    <div class="chips-area">
      <span class="chips-label">알림 분야:</span>
      <label class="chip"><input type="checkbox" name="interest" value="장학" checked>장학</label>
      <label class="chip"><input type="checkbox" name="interest" value="취창업" checked>취창업</label>
      <label class="chip"><input type="checkbox" name="interest" value="비교과" checked>비교과</label>
      <label class="chip"><input type="checkbox" name="interest" value="학사" checked>학사</label>
      <label class="chip"><input type="checkbox" name="interest" value="공모전" checked>공모전</label>
      <label class="chip"><input type="checkbox" name="interest" value="교환·어학" checked>교환·어학</label>
    </div>
  </section>

  <div class="tabs-wrapper">
    <button class="tab-btn" id="t-feed" aria-selected="true">
      <span>✨ 바로 지원 가능</span>
      <span class="tab-badge" id="n-feed">0</span>
    </button>
    <button class="tab-btn" id="t-gap" aria-selected="false">
      <span>🎯 조금만 더 채우면 가능 (GAP)</span>
      <span class="tab-badge" id="n-gap">0</span>
    </button>
  </div>

  <section class="summary-bar">
    <div class="stat-pill">
      <span class="stat-label">지원 적합 공고</span>
      <span class="stat-value" id="kpi-available">0건</span>
    </div>
    <div class="stat-pill">
      <span class="stat-label">놓치기 아까운 장학 기회</span>
      <span class="stat-value highlight" id="kpi-scholarship">0건</span>
    </div>
    <div class="stat-pill">
      <span class="stat-label">스펙 보완 시 가능 기회</span>
      <span class="stat-value" id="kpi-gap">0건</span>
    </div>
  </section>

  <main id="v-feed" class="card-list"></main>
  <main id="v-gap" class="card-list" style="display:none;"></main>
  <div id="hid" class="hiddenlist"></div>
</div>

<script>
(function(){
  // [수정] 실제 오늘 날짜(자정 기준)로 설정
  var now = new Date();
  var TODAY = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  // Google Apps Script API를 연결한 경우 아래 주소를 입력하세요.
  // URL이 비어있으면 내장 기본 데이터를 사용합니다.
  var SHEET_API_URL = "";

        return '<li><input type="checkbox" id="' + id + '-' + i + '"><label for="' + id + '-' + i + '">' + esc(s) + '</label></li>';
      }).join("") + '</ul></div>' +
      '<div><div class="sum-block-title">AI 판단 근거 문맥</div><div class="quote-box">"' + esc(n.q) + '"</div></div>' +
    '</div></details>';
  }

  function render() {
    uid = 0;
    var g = +el("p-grade").value;
    var f = el("p-field").value;
    var s = el("p-status").value;
    var gpa = +el("p-gpa").value;
    var toeic = +el("p-toeic").value;
    var team = +el("p-team").value;

    el("profile-summary-text").textContent = g + "학년 · " + FIELD[f] + " · " + STATUS[s];

    var ints = [].slice.call(document.querySelectorAll("input[name='interest']:checked")).map(function(x){ return x.value; });
    var feed = [], gaps = [], hidden = {}, off = 0;
    function hide(r){ hidden[r] = (hidden[r] || 0) + 1; }

    N.forEach(function(n) {
      var due = new Date(n.due[0], n.due[1], n.due[2]);
      var left = days(due, TODAY);

      // [핵심 기능] 기한이 지난 공고는 자동 제외
      if (left < 0) {
        hide("마감 종료");
        return;
      }

      if (n.grades.indexOf(g) < 0) { hide("학년 조건"); return; }
      if (n.status.indexOf(s) < 0) { hide("학적 조건"); return; }
      if (n.field && n.field.indexOf(f) < 0) { hide("전공 계열 조건"); return; }
      if (n.team && team > n.team) { hide("팀 인원 초과"); return; }
      if (ints.indexOf(n.cat) < 0) { off++; return; }

      var short = [];
      if (n.gpa && gpa < n.gpa) short.push({ k:"평점", cur:gpa, need:n.gpa, diff:+(n.gpa - gpa).toFixed(1), big:(n.gpa - gpa) > 0.5 });
      if (n.toeic && toeic < n.toeic) short.push({ k:"토익", cur:toeic, need:n.toeic, diff:n.toeic - toeic, big:(n.toeic - toeic) > 200 });

      var x = { n:n, due:due, left:left, short:short };
      if (!short.length) feed.push(x);
      else if (short.some(function(z){ return z.big; })) hide("조건 차이가 큼");
      else gaps.push(x);
    });

    feed.sort(function(a, b){
      var sa = a.n.cat === "장학" ? 0 : 1;
      var sb = b.n.cat === "장학" ? 0 : 1;
      return sa - sb || a.left - b.left;
    });
    gaps.sort(function(a, b){ return a.left - b.left; });

    var schCount = feed.filter(function(x){ return x.n.cat === "장학"; }).length;
    el("n-feed").textContent = feed.length;
    el("n-gap").textContent = gaps.length;
    el("kpi-available").innerHTML = "총 <b>" + feed.length + "</b>건";
    el("kpi-scholarship").innerHTML = "장학 <b>" + schCount + "</b>건";
    el("kpi-gap").innerHTML = "스펙 근접 <b>" + gaps.length + "</b>건";

    var ht = Object.keys(hidden).reduce(function(a, k){ return a + hidden[k]; }, 0);
    el("hid").textContent = (ht || off) ? "숨긴 공고 " + (ht + off) + "건 · " + Object.keys(hidden).map(function(k){ return k + " " + hidden[k] + "건"; }).concat(off ? ["관심 분야 밖 " + off + "건"] : []).join(" · ") : "숨긴 공고 없음";

    el("v-feed").innerHTML = feed.length ? feed.map(function(x) {
      var n = x.n;
      var start = new Date(x.due.getTime() - n.prep * 86400000);
      var must = x.left - n.prep <= 0;
      var prepText = n.prep === 0 ? "⚡ 즉시 온라인 접수 가능" : (must ? "🚨 서류 준비 " + n.prep + "일 필요 — <b>오늘 바로 착수</b>" : "서류 준비 약 " + n.prep + "일 소요 → <b>" + fmt(start) + "까지 준비 권장</b>");

      return '<article class="card">' +
        '<div class="dday-box ' + (x.left <= 7 ? 'hot' : '') + '">' +
          '<span class="dday-num">D-' + x.left + '</span>' +
          '<span class="dday-sub">' + (x.left === 0 ? '오늘마감' : (x.left <= 7 ? '마감임박' : '접수중')) + '</span>' +
        '</div>' +
        '<div class="card-content">' +
          '<div class="badge-row">' +
            '<span class="tag ' + (n.cat === "장학" ? 'sch' : 'primary') + '">' + n.cat + '</span>' +
            '<span class="tag">' + n.src + '</span>' +
            '<span class="tag date">마감 ' + fmt(x.due) + '</span>' +
            '<button class="btn-ics" onclick="downloadICS(\'' + esc(n.t) + '\', ' + n.due[0] + ', ' + n.due[1] + ', ' + n.due[2] + ')">📅 캘린더 등록</button>' +
          '</div>' +
          '<h3 class="card-title"><a href="' + esc(n.url) + '" target="_blank" rel="noopener">' + esc(n.t) + ' ↗</a></h3>' +
          '<div class="benefit-line">🎁 혜택: <b>' + esc(n.benefit) + '</b></div>' +
          '<div class="prep-box">' + prepText + '</div>' +
          summaryCard(n) +
        '</div>' +
      '</article>';
    }).join("") : '<div class="empty-state">현재 지원 가능한 공고가 없습니다. (기한이 지난 공고는 자동 숨김 처리됩니다)</div>';

    el("v-gap").innerHTML = gaps.length ? gaps.map(function(x) {
      var n = x.n;
      var lines = x.short.map(function(z) {
        var pct = Math.max(10, Math.min(100, Math.round(z.cur / z.need * 100)));
        var msg = z.k === "토익" ? "토익 <b>+" + z.diff + "점</b>만 더 채우면 지원 가능 (" + z.cur + " / " + z.need + ")" : "평점 <b>+" + z.diff + "</b>만 더 채우면 지원 가능 (" + z.cur + " / " + z.need + ")";
        return '<div style="margin-top:6px;">' +
          '<div style="font-size:13px; color:var(--ink-secondary);">' + msg + '</div>' +
          '<div class="gap-progress-wrap"><div class="gap-bar-fill" style="width:' + pct + '%;"></div></div>' +
          '<div class="guide-box"><b>💡 행동 솔루션</b><ul style="padding-left:16px; margin-top:4px;">' +
            GUIDE[z.k].map(function(gd){ return "<li><b>" + gd[0] + "</b>: " + esc(gd[1]) + "</li>"; }).join("") +
          '</ul></div>' +
        '</div>';
      }).join("");

      return '<article class="card">' +
        '<div class="dday-box gap">' +
          '<span class="dday-num">D-' + x.left + '</span>' +
          '<span class="dday-sub">도전가능</span>' +
        '</div>' +
        '<div class="card-content">' +
          '<div class="badge-row">' +
            '<span class="tag" style="background:var(--warn-soft); color:var(--warn); border-color:transparent;">스펙 근접</span>' +
            '<span class="tag">' + n.cat + '</span>' +
            '<span class="tag date">마감 ' + fmt(x.due) + '</span>' +
          '</div>' +
          '<h3 class="card-title"><a href="' + esc(n.url) + '" target="_blank" rel="noopener">' + esc(n.t) + ' ↗</a></h3>' +
          lines +
          summaryCard(n) +
        '</div>' +
      '</article>';
    }).join("") : '<div class="empty-state">현재 조건에서 근접한 갭 공고가 없습니다.</div>';
  }

  el("btn-toggle-profile").addEventListener("click", function(){
    var p = el("filter-panel");
    var isHidden = p.style.display === "none";
    p.style.display = isHidden ? "grid" : "none";
    el("btn-toggle-label").textContent = isHidden ? "닫기 ▴" : "조건 수정 ▾";
  });

  document.querySelectorAll(".filter-grid select, .chips-area input").forEach(function(i){
    i.addEventListener("change", render);
  });

  el("t-feed").addEventListener("click", function(){
    this.setAttribute("aria-selected", "true");
    el("t-gap").setAttribute("aria-selected", "false");
    el("v-feed").style.display = "flex";
    el("v-gap").style.display = "none";
  });
  el("t-gap").addEventListener("click", function(){
    this.setAttribute("aria-selected", "true");
    el("t-feed").setAttribute("aria-selected", "false");
    el("v-gap").style.display = "flex";
    el("v-feed").style.display = "none";
  });

  // 구글 시트 API URL이 지정되어 있으면 실시간 fetch, 없으면 내장 데이터로 즉시 렌더링
  if (SHEET_API_URL && SHEET_API_URL.startsWith("https://script.google.com")) {
    fetch(SHEET_API_URL)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data && data.length) { N = data; }
        render();
      })
      .catch(function(err) {
        console.warn("시트 API 연동 실패, 로컬 데이터로 대체:", err);
        render();
      });
  } else {
    render();
  }
})();
</script>
</body>
</html>
