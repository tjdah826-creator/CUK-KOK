<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>CUK콕</title>

  <!-- iOS PWA 메타 태그 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CUK콕">
  <meta name="theme-color" content="#00356B">

  <!-- CUK콕 앱 아이콘 -->
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='115' fill='%2300356B'/><circle cx='256' cy='256' r='180' fill='none' stroke='%23EDF4FD' stroke-width='14'/><path d='M256 120 V392 M160 210 H352' stroke='%23FFFFFF' stroke-width='32' stroke-linecap='round'/><circle cx='256' cy='210' r='20' fill='%23E53E3E'/><text x='256' y='445' font-size='56' font-family='sans-serif' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'>CUK-KOK</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cuk-primary: #00356B;
      --cuk-accent: #0A5FC2;
      --cuk-soft: #EDF4FD;
      --cuk-gold: #B37D20;
      --bg: #F7F9FC;
      --surface: #FFFFFF;
      --ink: #191F28;
      --ink-secondary: #4E5968;
      --muted: #8B95A1;
      --line: #E5E8EB;
      --line-subtle: #F2F4F6;
      --hot: #E53E3E;
      --hot-soft: #FEF0F0;
      --warn: #D97706;
      --warn-soft: #FEF3C7;
      --ok: #028A55;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.03), 0 2px 8px rgba(0,0,0,0.02);
      --shadow-md: 0 4px 16px rgba(0, 37, 85, 0.08);
      --shadow-hover: 0 8px 24px rgba(0, 37, 85, 0.12);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --font-body: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-display: "Hahmlet", serif;
      --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F141C;
        --surface: #18202C;
        --ink: #F2F4F8;
        --ink-secondary: #B0B8C6;
        --muted: #6B7684;
        --line: #263040;
        --line-subtle: #1E2634;
        --cuk-primary: #5296E8;
        --cuk-accent: #78B1F5;
        --cuk-soft: #172B45;
        --hot: #FF6B6B;
        --hot-soft: #381A1A;
        --warn: #FBBF24;
        --warn-soft: #382A12;
        --ok: #48D597;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* ==========================================================================
       레이아웃 분기: 모바일 vs 데스크탑
       ========================================================================== */
    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 데스크탑 2열 구조 (기본은 모바일 1열) */
    .dashboard-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 데스크탑(769px 이상) 전용 스타일 */
    @media (min-width: 769px) {
      body {
        padding-top: 28px;
        padding-bottom: 80px;
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 24px;
        align-items: start;
      }
      .desktop-sidebar {
        position: sticky;
        top: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      /* 데스크탑에서는 프로필 패널 항상 열림 */
      #filter-panel {
        display: grid !important;
      }
      #btn-toggle-label {
        display: none;
      }
      /* 데스크탑에서는 하단 탭바 숨김 */
      .mobile-bottom-nav {
        display: none !important;
      }
    }

    /* 모바일(768px 이하) 전용 스타일 */
    @media (max-width: 768px) {
      body {
        padding-bottom: 88px; /* 하단 탭바 공간 확보 */
      }
      .desktop-tabs-wrapper {
        display: none !important; /* 상단 탭 숨기고 하단 바로 이동 */
      }
      .card {
        padding: 16px !important;
      }
      .dday-box {
        width: 100%;
        flex-direction: row !important;
        justify-content: space-between !important;
        padding: 6px 12px !important;
      }
      .dday-sub { margin-top: 0 !important; }
    }

    /* 헤더 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 6px 4px 14px;
      border-bottom: 2px solid var(--line);
    }
    .brand-wrap { display: flex; flex-direction: column; gap: 4px; }
    .univ-tag {
      font-size: 12px;
      font-weight: 700;
      color: var(--cuk-accent);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .univ-tag::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cuk-accent);
    }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(22px, 3.5vw, 30px);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .header-sub { color: var(--ink-secondary); font-size: 13.5px; }

    /* 실시간 검색창 */
    .search-bar-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-bar-wrap:focus-within {
      border-color: var(--cuk-accent);
      box-shadow: 0 0 0 3px rgba(10, 95, 194, 0.12);
    }
    .search-icon {
      margin-left: 14px;
      color: var(--muted);
      font-size: 16px;
      user-select: none;
    }
    .search-input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      padding: 12px 10px;
      font: inherit;
      font-size: 14.5px;
      color: var(--ink);
    }
    .search-clear {
      margin-right: 12px;
      background: var(--line-subtle);
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    /* 프로필 패널 */
    .profile-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .profile-header {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .profile-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .profile-badge-summary {
      font-size: 12px;
      color: var(--ink-secondary);
      font-weight: 500;
    }
    .btn-toggle {
      background: var(--line-subtle);
      border: none;
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-secondary);
      cursor: pointer;
    }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 16px 18px;
      background: var(--bg);
      border-top: 1px solid var(--line-subtle);
    }
    @media (max-width: 480px) {
      .filter-grid { grid-template-columns: 1fr; }
    }
    .filter-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-secondary);
    }
    select {
      font: inherit;
      font-size: 13px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      outline: none;
    }

    /* 칩 필터 */
    .chips-area {
      padding: 12px 18px;
      border-top: 1px solid var(--line-subtle);
      background: var(--surface);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .chips-label { font-size: 12px; font-weight: 700; color: var(--muted); width: 100%; margin-bottom: 2px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12.5px;
      color: var(--ink-secondary);
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 4px 10px;
      border-radius: 99px;
      cursor: pointer;
    }
    .chip:has(input:checked) {
      background: var(--cuk-soft);
      border-color: var(--cuk-accent);
      color: var(--cuk-accent);
      font-weight: 600;
    }
    .chip input { accent-color: var(--cuk-accent); }

    /* 데스크탑 상단 탭바 */
    .desktop-tabs-wrapper {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 4px;
      box-shadow: var(--shadow-sm);
      gap: 6px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 14px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font: inherit;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .tab-btn[aria-selected="true"] {
      background: var(--cuk-primary);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0, 53, 107, 0.25);
    }
    .tab-badge {
      font-family: var(--font-mono);
      font-size: 11.5px;
      padding: 1px 6px;
      border-radius: 99px;
      background: rgba(0,0,0,0.06);
    }
    .tab-btn[aria-selected="true"] .tab-badge {
      background: rgba(255,255,255,0.25);
      color: #FFFFFF;
    }

    /* 모바일 하단 고정 플로팅 탭바 */
    .mobile-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-around;
      padding: 8px 12px max(10px, env(safe-area-inset-bottom));
      z-index: 999;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.05);
    }
    @media (prefers-color-scheme: dark) {
      .mobile-bottom-nav {
        background: rgba(24, 32, 44, 0.92);
      }
    }
    .m-nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      border: none;
      background: transparent;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 0;
    }
    .m-nav-icon { font-size: 18px; line-height: 1; }
    .m-nav-btn[aria-selected="true"] {
      color: var(--cuk-accent);
      font-weight: 700;
    }
    .m-nav-btn .m-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      background: var(--line-subtle);
      padding: 1px 5px;
      border-radius: 99px;
    }
    .m-nav-btn[aria-selected="true"] .m-badge {
      background: var(--cuk-soft);
      color: var(--cuk-accent);
    }

    /* 통계 및 정렬 바 */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .summary-bar { display: flex; flex-wrap: wrap; gap: 8px; }
    .stat-pill-sm {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 5px 10px;
      font-size: 12px;
      color: var(--ink-secondary);
    }
    .stat-pill-sm b { color: var(--cuk-accent); }
    .stat-pill-sm b.hot { color: var(--hot); }

    .sort-wrap { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .sort-select {
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-secondary);
    }

    /* 공고 카드 벤토 그리드 */
    .card-list { display: flex; flex-direction: column; gap: 12px; }
    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      display: grid;
      grid-template-columns: 74px 1fr;
      gap: 16px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    /* D-day 뱃지 */
    .dday-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--cuk-soft);
      border: 1px solid rgba(10, 95, 194, 0.15);
      border-radius: var(--radius-md);
      padding: 8px 6px;
      height: fit-content;
      text-align: center;
    }
    .dday-num { font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--cuk-accent); }
    .dday-sub { font-size: 10.5px; font-weight: 600; color: var(--muted); }
    .dday-box.hot {
      background: var(--hot-soft);
      border-color: rgba(229, 62, 62, 0.3);
      animation: pulse-border 2s infinite ease-in-out;
    }
    .dday-box.hot .dday-num { color: var(--hot); }
    .dday-box.gap { background: var(--warn-soft); border-color: rgba(217, 119, 6, 0.2); }
    .dday-box.gap .dday-num { color: var(--warn); }

    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(229, 62, 62, 0.3); }
      70% { box-shadow: 0 0 0 6px rgba(229, 62, 62, 0); }
      100% { box-shadow: 0 0 0 0 rgba(229, 62, 62, 0); }
    }

    /* 카드 세부 본문 */
    .card-content { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink-secondary);
      border: 1px solid var(--line);
    }
    .tag.sch { background: var(--hot-soft); color: var(--hot); border-color: transparent; }
    .tag.primary { background: var(--cuk-soft); color: var(--cuk-accent); border-color: transparent; }
    .tag.date { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); border: none; background: transparent; }

    .action-btns { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .btn-icon {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 4px 8px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .btn-icon:hover { background: var(--bg); }
    .btn-bookmark.active {
      background: #FCF5E8;
      border-color: var(--cuk-gold);
      color: var(--cuk-gold);
    }

    .card-title {
      font-size: 15.5px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--ink);
    }
    .card-title a { color: inherit; text-decoration: none; }
    .card-title a:hover { color: var(--cuk-accent); }

    .benefit-line { font-size: 13px; color: var(--ink-secondary); }
    .benefit-line b { color: var(--cuk-primary); font-weight: 700; }

    .prep-box {
      font-size: 12px;
      color: var(--ink-secondary);
      background: var(--line-subtle);
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
    }
    .prep-box b { color: var(--ink); }

    /* 서류 프로그레스 & 아코디언 */
    details {
      background: var(--bg);
      border: 1px solid var(--line-subtle);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 4px;
    }
    summary {
      cursor: pointer;
      color: var(--cuk-accent);
      font-weight: 600;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "▾"; font-size: 13px; transition: transform 0.2s; }
    details[open] summary::after { transform: rotate(180deg); }

    .doc-progress-bar {
      margin-top: 8px;
      background: var(--line);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }
    .doc-progress-fill {
      background: var(--ok);
      height: 100%;
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .sum-content {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }
    .sum-block-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .sum-content ul { padding-left: 16px; display: flex; flex-direction: column; gap: 2px; }
    .sum-content ul.caution li { color: var(--hot); }
    .sum-content ul.caution li span { color: var(--ink); }
    .docs-list { list-style: none; padding-left: 0!important; display: flex; flex-direction: column; gap: 5px; }
    .docs-list li { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .quote-box {
      font-size: 11.5px;
      color: var(--ink-secondary);
      padding: 6px 10px;
      background: var(--surface);
      border-left: 3px solid var(--cuk-accent);
      border-radius: 0 4px 4px 0;
    }

    .gap-progress-wrap {
      margin-top: 6px;
      background: var(--line-subtle);
      border-radius: 99px;
      height: 7px;
      overflow: hidden;
    }
    .gap-bar-fill {
      background: linear-gradient(90deg, #F59E0B, #E53E3E);
      height: 100%;
      border-radius: 99px;
    }
    .guide-box {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      margin-top: 6px;
      font-size: 12.5px;
    }
    .empty-state {
      padding: 40px 16px;
      text-align: center;
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px dashed var(--line);
      color: var(--muted);
    }
    .hiddenlist {
      padding: 12px 16px;
      font-size: 12.5px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
    }

    /* 토스트 알림 */
    .toast {
      position: fixed;
      bottom: 74px; /* 모바일 하단 탭바 위 */
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(25, 31, 40, 0.92);
      backdrop-filter: blur(8px);
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
      opacity: 0;
      z-index: 9999;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 상단 헤더 -->
  <header>

  var FIELD = {hum:"인문·사회", biz:"경영·경제", sci:"자연·공학", art:"예체능"};
  var STATUS = {enrolled:"재학", leave:"휴학"};

  var bookmarks = JSON.parse(localStorage.getItem("cuk_bookmarks") || "[]");
  var checkedDocs = JSON.parse(localStorage.getItem("cuk_checked_docs") || "{}");
  var currentTab = "feed"; // "feed", "gap", "bookmark"

  function saveBookmarks() { localStorage.setItem("cuk_bookmarks", JSON.stringify(bookmarks)); }
  function saveCheckedDocs() { localStorage.setItem("cuk_checked_docs", JSON.stringify(checkedDocs)); }

  function el(id){ return document.getElementById(id); }
  function days(a, b){ return Math.round((a - b) / 86400000); }
  function fmt(d){ return (d.getMonth() + 1) + "." + String(d.getDate()).padStart(2, "0"); }
  function esc(s){ return String(s || "").replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function showToast(msg) {
    var t = el("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 2000);
  }

  window.downloadICS = function(title, y, m, d) {
    var dtStr = y + String(m + 1).padStart(2, '0') + String(d).padStart(2, '0') + "T090000Z";
    var icsData = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//CUK-KOK//Scheduler//KO",
      "BEGIN:VEVENT",
      "SUMMARY:[CUK콕 마감] " + title,
      "DTSTART:" + dtStr,
      "DTEND:" + dtStr,
      "DESCRIPTION:CUK콕 마감 일정 알림",
      "END:VEVENT",
      "END:VCALENDAR"
    ].join("\r\n");

    var blob = new Blob([icsData], { type: "text/calendar;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = title.substring(0, 15) + "_마감.ics";
    a.click();
    URL.revokeObjectURL(url);
    showToast("📅 캘린더 파일(.ics) 다운로드 완료");
  };

  window.copyNoticeLink = function(url) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function() {
        showToast("🔗 공고 링크가 복사되었습니다!");
      });
    } else {
      showToast("공고 URL: " + url);
    }
  };

  window.toggleBookmark = function(id) {
    var idx = bookmarks.indexOf(id);
    if (idx > -1) {
      bookmarks.splice(idx, 1);
      showToast("보관함에서 삭제되었습니다.");
    } else {
      bookmarks.push(id);
      showToast("⭐ 보관함에 담겼습니다!");
    }
    saveBookmarks();
    render();
  };

  window.toggleDocCheck = function(docKey) {
    checkedDocs[docKey] = !checkedDocs[docKey];
    saveCheckedDocs();
    render();
  };

  var uid = 0;
  function summaryCard(n) {
    var id = n.id || ("d" + (uid++));
    var sumList = Array.isArray(n.sum) ? n.sum : [n.t || "공고 내용 확인"];
    var cautionList = Array.isArray(n.caution) ? n.caution : ["세부 선발 기준 원문 공고 확인"];
    var docsList = Array.isArray(n.docs) ? n.docs : ["신청서 및 관련 증빙"];

    var checkedCount = 0;
    docsList.forEach(function(d, i){
      if (checkedDocs[id + "-doc-" + i]) checkedCount++;
    });
    var pct = docsList.length ? Math.round((checkedCount / docsList.length) * 100) : 0;

    return '<details><summary><span>핵심 요약 & 서류 체크 (' + checkedCount + '/' + docsList.length + ' 완료)</span></summary>' +
      '<div class="doc-progress-bar"><div class="doc-progress-fill" style="width:' + pct + '%;"></div></div>' +
      '<div class="sum-content">' +
        '<div><div class="sum-block-title">3줄 핵심 요약</div><ul>' + sumList.map(function(s){ return "<li>" + esc(s) + "</li>"; }).join("") + '</ul></div>' +
        '<div><div class="sum-block-title">참가 주의 요건</div><ul class="caution">' + cautionList.map(function(s){ return "<li><span>" + esc(s) + "</span></li>"; }).join("") + '</ul></div>' +
        '<div><div class="sum-block-title">필요 서류 체크리스트</div><ul class="docs-list">' + docsList.map(function(s, i){
          var docKey = id + "-doc-" + i;
          var isChecked = checkedDocs[docKey] ? "checked" : "";
          return '<li><input type="checkbox" id="' + docKey + '" ' + isChecked + ' onchange="toggleDocCheck(\'' + docKey + '\')"><label for="' + docKey + '">' + esc(s) + '</label></li>';
        }).join("") + '</ul></div>' +
        '<div><div class="sum-block-title">AI 판단 근거 문맥</div><div class="quote-box">"' + esc(n.q || n.t) + '"</div></div>' +
      '</div></details>';
  }

  function render() {
    uid = 0;
    var g = +el("p-grade").value;
    var f = el("p-field").value;
    var s = el("p-status").value;
    var gpa = +el("p-gpa").value;
    var toeic = +el("p-toeic").value;
    var team = +el("p-team").value;
    var query = (el("live-search").value || "").trim().toLowerCase();
    var sortOpt = el("sort-select").value;

    el("profile-summary-text").textContent = g + "학년 · " + FIELD[f] + " · " + STATUS[s];

    var ints = [].slice.call(document.querySelectorAll("input[name='interest']:checked")).map(function(x){ return x.value; });
    var feed = [], gaps = [], bookmarked = [], hidden = {}, off = 0;
    function hide(r){ hidden[r] = (hidden[r] || 0) + 1; }

    N.forEach(function(n) {
      var due;
      if (Array.isArray(n.due) && n.due.length >= 3) {
        due = new Date(n.due[0], n.due[1], n.due[2]);
      } else if (typeof n.due === "string") {
        var dp = n.due.split("-");
        due = new Date(+dp[0], +dp[1] - 1, +dp[2]);
      } else {
        due = new Date();
      }

      var left = days(due, TODAY);

      // 지난 공고 제외
      if (left < 0) {
        hide("마감 종료");
        return;
      }

      // 검색어 필터
      if (query) {
        var fullText = (n.t + " " + (n.benefit || "") + " " + (n.src || "") + " " + (n.cat || "") + " " + (n.q || "")).toLowerCase();
        if (fullText.indexOf(query) === -1) return;
      }

      var x = { n:n, due:due, left:left, short:[] };

      // 보관함 수집
      if (bookmarks.indexOf(n.id) > -1) {
        bookmarked.push(x);
      }

      var grades = Array.isArray(n.grades) ? n.grades : [1, 2, 3, 4];
      var status = Array.isArray(n.status) ? n.status : ["enrolled", "leave"];

      if (grades.indexOf(g) < 0) { hide("학년 조건"); return; }
      if (status.indexOf(s) < 0) { hide("학적 조건"); return; }
      if (n.field && n.field.indexOf(f) < 0) { hide("전공 계열 조건"); return; }
      if (n.team && team > n.team) { hide("팀 인원 초과"); return; }
      if (ints.indexOf(n.cat) < 0) { off++; return; }

      var short = [];
      if (n.gpa && gpa < n.gpa) short.push({ k:"평점", cur:gpa, need:n.gpa, diff:+(n.gpa - gpa).toFixed(1), big:(n.gpa - gpa) > 0.5 });
      if (n.toeic && toeic < n.toeic) short.push({ k:"토익", cur:toeic, need:n.toeic, diff:n.toeic - toeic, big:(n.toeic - toeic) > 200 });

      x.short = short;
      if (!short.length) feed.push(x);
      else if (!short.some(function(z){ return z.big; })) gaps.push(x);
      else hide("조건 차이가 큼");
    });

    // 정렬 함수
    function sortItems(arr) {
      arr.sort(function(a, b){
        if (sortOpt === "sch") {
          var sa = a.n.cat === "장학" ? 0 : 1, sb = b.n.cat === "장학" ? 0 : 1;
          if (sa !== sb) return sa - sb;
        } else if (sortOpt === "prep") {
          var pa = a.n.prep || 0, pb = b.n.prep || 0;
          if (pa !== pb) return pa - pb;
        }
        return a.left - b.left;
      });
    }

    sortItems(feed);
    sortItems(gaps);
    sortItems(bookmarked);

    var schCount = feed.filter(function(x){ return x.n.cat === "장학"; }).length;

    // 카운트 갱신 (데스크탑 탭 & 모바일 하단바 동기화)
    el("dt-cnt-feed").textContent = feed.length;
    el("dt-cnt-gap").textContent = gaps.length;
    el("dt-cnt-bookmark").textContent = bookmarked.length;
    el("mb-cnt-feed").textContent = feed.length;
    el("mb-cnt-gap").textContent = gaps.length;
    el("mb-cnt-bookmark").textContent = bookmarked.length;

    el("kpi-available").textContent = feed.length + "건";
    el("kpi-scholarship").textContent = schCount + "건";

    var ht = Object.keys(hidden).reduce(function(a, k){ return a + hidden[k]; }, 0);
    el("hid").textContent = (ht || off) ? "숨긴 공고 " + (ht + off) + "건 · " + Object.keys(hidden).map(function(k){ return k + " " + hidden[k] + "건"; }).concat(off ? ["관심 분야 밖 " + off + "건"] : []).join(" · ") : "숨긴 공고 없음";

    function buildCard(x, isGap) {
      var n = x.n;
      var prep = n.prep || 2;
      var start = new Date(x.due.getTime() - prep * 86400000);
      var must = x.left - prep <= 0;
      var prepText = prep === 0 ? "⚡ 즉시 접수 가능" : (must ? "🚨 서류 준비 " + prep + "일 소요 — <b>오늘 바로 착수</b>" : "서류 준비 약 " + prep + "일 소요 → <b>" + fmt(start) + "까지 시작 권장</b>");

      var isBookmarked = bookmarks.indexOf(n.id) > -1;
      var isHot = x.left <= 3;
      var dueY = x.due.getFullYear(), dueM = x.due.getMonth(), dueD = x.due.getDate();

      var gapHtml = "";
      if (isGap && x.short) {
        gapHtml = x.short.map(function(z) {
          var pct = Math.max(10, Math.min(100, Math.round(z.cur / z.need * 100)));
          var msg = z.k === "토익" ? "토익 <b>+" + z.diff + "점</b>만 더 채우면 지원 가능 (" + z.cur + " / " + z.need + ")" : "평점 <b>+" + z.diff + "</b>만 더 채우면 지원 가능 (" + z.cur + " / " + z.need + ")";
          return '<div style="margin-top:6px;">' +
            '<div style="font-size:13px; color:var(--ink-secondary);">' + msg + '</div>' +
            '<div class="gap-progress-wrap"><div class="gap-bar-fill" style="width:' + pct + '%;"></div></div>' +
            '<div class="guide-box"><b>💡 행동 솔루션</b><ul style="padding-left:16px; margin-top:4px;">' +
              (GUIDE[z.k] || []).map(function(gd){ return "<li><b>" + gd[0] + "</b>: " + esc(gd[1]) + "</li>"; }).join("") +
            '</ul></div>' +
          '</div>';
        }).join("");
      }

      return '<article class="card">' +
        '<div class="dday-box ' + (isHot ? 'hot' : (isGap ? 'gap' : '')) + '">' +
          '<span class="dday-num">D-' + x.left + '</span>' +
          '<span class="dday-sub">' + (x.left === 0 ? '오늘마감' : (isHot ? '마감임박' : '접수중')) + '</span>' +
        '</div>' +
        '<div class="card-content">' +
          '<div class="badge-row">' +
            '<span class="tag ' + (n.cat === "장학" ? 'sch' : 'primary') + '">' + esc(n.cat) + '</span>' +
            '<span class="tag">' + esc(n.src || "교내") + '</span>' +
            '<span class="tag date">마감 ' + fmt(x.due) + '</span>' +
            '<div class="action-btns">' +
              '<button class="btn-icon btn-bookmark ' + (isBookmarked ? 'active' : '') + '" onclick="toggleBookmark(\'' + n.id + '\')">' + (isBookmarked ? '★ 찜됨' : '☆ 찜') + '</button>' +
              '<button class="btn-icon" onclick="copyNoticeLink(\'' + esc(n.url) + '\')">🔗 공유</button>' +
              '<button class="btn-icon" onclick="downloadICS(\'' + esc(n.t) + '\', ' + dueY + ', ' + dueM + ', ' + dueD + ')">📅 캘린더</button>' +
            '</div>' +
          '</div>' +
          '<h3 class="card-title"><a href="' + esc(n.url) + '" target="_blank" rel="noopener">' + esc(n.t) + ' ↗</a></h3>' +
          '<div class="benefit-line">🎁 혜택: <b>' + esc(n.benefit || "공고 내용 참조") + '</b></div>' +
          '<div class="prep-box">' + prepText + '</div>' +
          gapHtml +
          summaryCard(n) +
        '</div>' +
      '</article>';
    }

    el("v-feed").innerHTML = feed.length ? feed.map(function(x){ return buildCard(x, false); }).join("") : '<div class="empty-state">지원 가능한 공고가 없습니다. (검색어 또는 필터를 확인해 보세요)</div>';
    el("v-gap").innerHTML = gaps.length ? gaps.map(function(x){ return buildCard(x, true); }).join("") : '<div class="empty-state">현재 조건에서 근접한 갭 보완 공고가 없습니다.</div>';
    el("v-bookmark").innerHTML = bookmarked.length ? bookmarked.map(function(x){ return buildCard(x, false); }).join("") : '<div class="empty-state">보관함에 저장된 공고가 없습니다. 마음에 드는 공고의 [☆ 찜]을 눌러보세요!</div>';
  }

  // 탭 동기화 전환 함수 (데스크탑 상단 탭 & 모바일 하단 탭 양방향 반영)
  function switchTab(tabKey) {
    currentTab = tabKey;
    var keys = ["feed", "gap", "bookmark"];

    keys.forEach(function(k){
      var isAct = (k === tabKey);
      el("dt-" + k).setAttribute("aria-selected", isAct ? "true" : "false");
      el("mb-" + k).setAttribute("aria-selected", isAct ? "true" : "false");
      el("v-" + k).style.display = isAct ? "flex" : "none";
    });

    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // 데스크탑 탭 이벤트
  el("dt-feed").addEventListener("click", function(){ switchTab("feed"); });
  el("dt-gap").addEventListener("click", function(){ switchTab("gap"); });
  el("dt-bookmark").addEventListener("click", function(){ switchTab("bookmark"); });

  // 모바일 하단바 이벤트
  el("mb-feed").addEventListener("click", function(){ switchTab("feed"); });
  el("mb-gap").addEventListener("click", function(){ switchTab("gap"); });
  el("mb-bookmark").addEventListener("click", function(){ switchTab("bookmark"); });

  // 검색 & 필터 & 정렬 이벤트
  var searchInput = el("live-search");
  var searchClear = el("search-clear-btn");
  searchInput.addEventListener("input", function(){
    searchClear.style.display = this.value ? "flex" : "none";
    render();
  });
  searchClear.addEventListener("click", function(){
    searchInput.value = "";
    this.style.display = "none";
    render();
  });

  el("sort-select").addEventListener("change", render);

  el("btn-toggle-profile").addEventListener("click", function(){
    var p = el("filter-panel");
    var isHidden = p.style.display === "none";
    p.style.display = isHidden ? "grid" : "none";
    el("btn-toggle-label").textContent = isHidden ? "닫기 ▴" : "조건 수정 ▾";
  });

  document.querySelectorAll(".filter-grid select, .chips-area input").forEach(function(i){
    i.addEventListener("change", render);
  });

  // 초기 실행
  render();

  // 구글 시트 연동 비동기 데이터 갱신
  if (SHEET_API_URL && SHEET_API_URL.startsWith("https://script.google.com")) {
    fetch(SHEET_API_URL)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (Array.isArray(data) && data.length > 0) {
          N = data;
          render();
        }
      })
      .catch(function(err) {
        console.warn("시트 API 연동 실패 (기본 데이터 유지):", err);
      });
  }
})();
</script>
</body>
</html>
